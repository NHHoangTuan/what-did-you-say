name: noi_gi_vay
description: "Từ điển slang Gen Z tiếng Việt — tra nghĩa nhanh, hiểu đúng vibe."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Code generation (runtime annotations)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Share
  share_plus: ^10.1.4

  # Fonts & UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Splash (dùng FlutterNativeSplash.remove() trong main)
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code generators
  build_runner: ^2.4.13
  freezed: ^3.0.0
  riverpod_generator: ^2.6.3
  json_serializable: ^6.8.0

  # App icon & splash
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/

# App icon config
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/images/app_icon_fg.png"

# Splash screen config
flutter_native_splash:
  color: "#0D0D0D"
  image: "assets/images/splash_logo.png"
  android: true
  ios: false
  android_12:
    color: "#0D0D0D"
    image: "assets/images/splash_logo.png"

name: noi_gi_vay
description: "Từ điển slang Gen Z tiếng Việt — tra nghĩa nhanh, hiểu đúng vibe."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local DB
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Code generation (runtime annotations)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Share
  share_plus: ^10.1.4

  # Fonts & UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code generators
  build_runner: ^2.4.13
  freezed: ^3.0.0
  riverpod_generator: ^2.6.3
  json_serializable: ^6.8.0


flutter:
  uses-material-design: true

  assets:
    - assets/data/


